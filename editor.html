<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYOFFICE Document Frame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #2b2b2b;
            font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #dfdbd2;
        }
        #iframeEditor {
            height: 100%;
            width: 100%;
            border: none;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: #e5e5e5;
            text-align: center;
            padding: 24px;
            background: #242424;
            border: 1px solid #3c3b37;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 440px;
            width: 90%;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #E95420;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .demo-mode-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            color: #222222;
        }
        .editor-top-toolbar {
            height: 48px;
            background: #f1f2f4;
            border-bottom: 1px solid #dcdfe4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }
        .brand-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 14px;
        }
        .brand-badge i {
            font-size: 20px;
        }
        .brand-badge.word i { color: #2b579a; }
        .brand-badge.cell i { color: #217346; }
        .brand-badge.slide i { color: #d24726; }

        .toolbar-pills {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .pill-vps {
            background: #e8f4fd;
            color: #1976d2;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pill-vps i { font-size: 10px; }
        .doc-canvas {
            flex: 1;
            padding: 30px;
            background: #e9eaed;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }
        .doc-sheet {
            background: #ffffff;
            width: 100%;
            max-width: 820px;
            min-height: 100%;
            padding: 48px 56px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            border: 1px solid #dadce0;
            border-radius: 3px;
            line-height: 1.6;
        }
        .doc-sheet h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #111;
            border-bottom: 2px solid #E95420;
            padding-bottom: 8px;
        }
        .doc-sheet h2 {
            font-size: 16px;
            margin: 20px 0 10px;
            color: #333;
        }
        .doc-sheet p {
            margin-bottom: 12px;
            color: #444;
            font-size: 13.5px;
        }
        .doc-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 13px;
        }
        .doc-table th, .doc-table td {
            border: 1px solid #d1d5db;
            padding: 8px 12px;
            text-align: left;
        }
        .doc-table th {
            background: #f3f4f6;
            font-weight: 600;
        }
        .callout-vps {
            background: #fff8f0;
            border-left: 4px solid #E95420;
            padding: 12px 16px;
            border-radius: 4px;
            margin: 20px 0;
            font-size: 12.5px;
            color: #663c00;
        }
        .callout-vps code {
            background: #f0ebe4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <span id="loaderMsg">Initializing ONLYOFFICE DocumentServer Engine...</span>
    </div>

    <div id="iframeEditor"></div>

    <script>
        // Parse requested document type
        const urlParams = new URLSearchParams(window.location.search);
        const reqType = (urlParams.get('type') || 'word').toLowerCase();

        // Optional: User-configured VPS DocumentServer endpoint
        // Example: 'https://docs.your-domain.com'
        const customVpsUrl = localStorage.getItem('onlyoffice_vps_endpoint') || '';

        const docTypes = {
            word: {
                docType: 'word',
                fileType: 'docx',
                title: 'Infrastructure-Security-Audit.docx',
                icon: 'fa-file-word',
                colorClass: 'word',
                badgeText: 'Word Document',
                sampleUrl: 'https://raw.githubusercontent.com/ONLYOFFICE/document-templates/master/sample-files/docx/sample.docx'
            },
            cell: {
                docType: 'cell',
                fileType: 'xlsx',
                title: 'Network-Traffic-Metrics.xlsx',
                icon: 'fa-file-excel',
                colorClass: 'cell',
                badgeText: 'Excel Spreadsheet',
                sampleUrl: 'https://raw.githubusercontent.com/ONLYOFFICE/document-templates/master/sample-files/xlsx/sample.xlsx'
            },
            slide: {
                docType: 'slide',
                fileType: 'pptx',
                title: 'DevOps-Architecture-Deck.pptx',
                icon: 'fa-file-powerpoint',
                colorClass: 'slide',
                badgeText: 'PowerPoint Presentation',
                sampleUrl: 'https://raw.githubusercontent.com/ONLYOFFICE/document-templates/master/sample-files/pptx/sample.pptx'
            }
        };

        const activeDoc = docTypes[reqType] || docTypes.word;

        // If a custom VPS endpoint is defined, attempt to dynamically load DocsAPI
        if (customVpsUrl) {
            const script = document.createElement('script');
            script.src = `${customVpsUrl.replace(/\/$/, '')}/web-apps/apps/api/documents/api.js`;
            script.onload = () => initDocsApi();
            script.onerror = () => renderDemoViewer(true);
            document.head.appendChild(script);
        } else {
            // Render the built-in interactive ONLYOFFICE Document Viewer simulation
            setTimeout(() => {
                renderDemoViewer(false);
            }, 500);
        }

        function initDocsApi() {
            try {
                if (typeof DocsAPI !== 'undefined') {
                    const config = {
                        document: {
                            fileType: activeDoc.fileType,
                            key: 'doc_' + activeDoc.docType + '_' + Date.now(),
                            title: activeDoc.title,
                            url: activeDoc.sampleUrl,
                            permissions: {
                                download: true,
                                edit: true,
                                print: true,
                                review: true
                            }
                        },
                        documentType: activeDoc.docType,
                        editorConfig: {
                            mode: 'edit',
                            lang: 'en',
                            user: {
                                id: 'evaluator',
                                name: 'Portfolio Evaluator'
                            },
                            customization: {
                                autosave: false,
                                comments: true,
                                compactHeader: true
                            }
                        },
                        width: '100%',
                        height: '100%',
                        events: {
                            onAppReady: () => {
                                document.getElementById('loader').style.display = 'none';
                            },
                            onError: () => renderDemoViewer(true)
                        }
                    };
                    new DocsAPI.DocEditor('iframeEditor', config);
                    return;
                }
            } catch (err) {
                console.warn('ONLYOFFICE DocsAPI fallback to interactive viewer:', err);
            }
            renderDemoViewer(false);
        }

        function renderDemoViewer(hadError) {
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';

            const container = document.getElementById('iframeEditor');
            let contentHtml = '';

            if (reqType === 'cell') {
                contentHtml = `
                    <h1><i class="fa-solid fa-table"></i> ISTA Assaka - Network Performance & Telemetry</h1>
                    <p>Live telemetry audit report logged across VLANs and infrastructure switches.</p>
                    <table class="doc-table">
                        <thead>
                            <tr>
                                <th>Subnet / VLAN</th>
                                <th>Gateway IP</th>
                                <th>Active Hosts</th>
                                <th>Bandwidth In/Out</th>
                                <th>Security State</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>VLAN 10 - Admin Core</td>
                                <td>192.168.10.1</td>
                                <td>14</td>
                                <td>820 Mbps / 410 Mbps</td>
                                <td><span style="color:#2e7d32;font-weight:bold;">Hardened / OK</span></td>
                            </tr>
                            <tr>
                                <td>VLAN 20 - Virtualization Farm</td>
                                <td>192.168.20.1</td>
                                <td>28</td>
                                <td>1.8 Gbps / 1.4 Gbps</td>
                                <td><span style="color:#2e7d32;font-weight:bold;">Hardened / OK</span></td>
                            </tr>
                            <tr>
                                <td>VLAN 30 - ESP32 IoT Sensor Mesh</td>
                                <td>192.168.30.1</td>
                                <td>52</td>
                                <td>45 Mbps / 20 Mbps</td>
                                <td><span style="color:#e65100;font-weight:bold;">Isolated / Monitored</span></td>
                            </tr>
                            <tr>
                                <td>VLAN 40 - DMZ ONLYOFFICE Cluster</td>
                                <td>192.168.40.1</td>
                                <td>6</td>
                                <td>340 Mbps / 280 Mbps</td>
                                <td><span style="color:#2e7d32;font-weight:bold;">SSL TLS 1.3 Active</span></td>
                            </tr>
                        </tbody>
                    </table>
                `;
            } else if (reqType === 'slide') {
                contentHtml = `
                    <h1><i class="fa-solid fa-desktop"></i> DevOps Architecture & Systems Engineering</h1>
                    <h2>Slide 1: Cloud & Digital Infrastructure Topology</h2>
                    <p>&bull; <strong>Multi-Tenant Virtualization:</strong> Orchestrated Linux (Ubuntu/Kali) and Windows Server AD DS clusters.</p>
                    <p>&bull; <strong>Embedded IoT Integration:</strong> Real-time ESP32-S3 sensor capture sending TLS telemetry to local endpoints.</p>
                    <p>&bull; <strong>Document Collaboration Server:</strong> ONLYOFFICE DocumentServer containerized with Docker, Nginx reverse proxy, and SSL offloading.</p>
                    <h2>Slide 2: Security & Hardening Protocols</h2>
                    <p>&bull; Zero Trust segmentation with Layer 3 ACLs on Cisco architectures.</p>
                    <p>&bull; Automated vulnerability reconnaissance using Nmap, Wireshark, and Python scripts.</p>
                `;
            } else {
                contentHtml = `
                    <h1><i class="fa-solid fa-shield-halved"></i> Digital Infrastructure & Security Audit Specification</h1>
                    <p><strong>Prepared by:</strong> Jamal Idhammou (Specialized Technician in Digital Infrastructure)</p>
                    <p><strong>Institution:</strong> ISTA Assaka, Agadir, Morocco &bull; Systems, Networks & Cybersecurity</p>
                    <h2>1. Scope & Objective</h2>
                    <p>This document details the configuration requirements for self-hosted collaborative cloud infrastructure, including the <strong>ONLYOFFICE DocumentServer</strong> deployment inside containerized enterprise environments.</p>
                    <h2>2. Container Architecture & Reverse Proxy</h2>
                    <p>Deployment is isolated inside a Docker container bound to an internal network interface. Nginx serves as the SSL/TLS termination edge with WebSocket proxy headers enabled for live collaborative co-authoring.</p>
                `;
            }

            container.innerHTML = `
                <div class="demo-mode-view">
                    <div class="editor-top-toolbar">
                        <div class="brand-badge ${activeDoc.colorClass}">
                            <i class="fa-solid ${activeDoc.icon}"></i>
                            <span>ONLYOFFICE &bull; ${activeDoc.title}</span>
                        </div>
                        <div class="toolbar-pills">
                            <span class="pill-vps"><i class="fa-solid fa-server"></i> ONLYOFFICE DocumentServer Engine</span>
                        </div>
                    </div>
                    <div class="doc-canvas">
                        <div class="doc-sheet">
                            ${contentHtml}
                            <div class="callout-vps">
                                <strong><i class="fa-solid fa-circle-info"></i> ONLYOFFICE DocumentServer VPS Connection:</strong><br>
                                Self-host ONLYOFFICE on your Linux server via:
                                <code>docker run -i -t -d -p 8080:80 --restart always onlyoffice/documentserver</code><br>
                                Configure your VPS URL in settings or localStorage (<code>onlyoffice_vps_endpoint</code>) to bind this editor directly to your live DocumentServer instance.
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
